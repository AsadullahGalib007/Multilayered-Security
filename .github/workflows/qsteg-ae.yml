name: qsteg-ae

# QSTEG-AE lives in a subdirectory of this repo, so every step runs from qsteg-ae/
# and the triggers are scoped to it — the parent repo's baseline scripts are not
# part of this suite.
on:
  push:
    branches: ["main", "phase/**"]
    paths: ["qsteg-ae/**", ".github/workflows/qsteg-ae.yml"]
  pull_request:
    paths: ["qsteg-ae/**", ".github/workflows/qsteg-ae.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: qsteg-ae

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/check.sh runs the experiment harness, which records the commit SHA
          # in every manifest. A shallow clone still resolves HEAD, but fetch-depth 0
          # keeps `git describe`-style provenance available to future experiments.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: qsteg-ae/uv.lock

      # liboqs is a native build that is NOT in uv.lock (decision 001), so it must be
      # restored or rebuilt explicitly or the ML-KEM tests silently skip.
      - name: Cache liboqs
        id: liboqs-cache
        uses: actions/cache@v4
        with:
          path: ~/_oqs
          key: liboqs-0.16.0-${{ runner.os }}-${{ hashFiles('qsteg-ae/scripts/bootstrap_liboqs.sh') }}

      - name: Build liboqs
        if: steps.liboqs-cache.outputs.cache-hit != 'true'
        run: ./scripts/bootstrap_liboqs.sh

      - name: Sync environment
        run: uv sync --all-groups --frozen

      - name: Run checks
        run: ./scripts/check.sh

      # A failed run still writes a manifest marked "failed"; keeping them makes a CI
      # failure diagnosable without a local repro.
      - name: Upload manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: qsteg-ae/results/**/manifest.json
          if-no-files-found: ignore
